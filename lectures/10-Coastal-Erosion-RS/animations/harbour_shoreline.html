<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#F6F5F1;overflow:hidden}canvas{display:block}</style></head><body><canvas id="c" width="3328" height="1280" style="width:1664px;height:640px"></canvas><script>
(function(){
var cv=document.getElementById('c'),g=cv.getContext('2d'),S=2;
var FONT='-apple-system,Segoe UI,Helvetica,Arial,sans-serif',NAVY='#13233A',SOFT='#4A5563',RULE='#E2DFD7',ACC='#C2410C',BLUE='#2F6DB5',SAND='#E9D7A7',SEA='#8FB3DD',GREEN='#7E9B6A';
var EPS=0.30,TANA=0.05,YEARS=30,CYC=16;
function erfc(x){var t=1/(1+0.3275911*x);return t*(0.254829592+t*(-0.284496736+t*(1.421413741+t*(-1.453152027+t*1.061405429))))*Math.exp(-x*x);}
function dy(xk,ty){if(0.0001>ty){return 0;}var s=Math.sqrt(EPS*ty),ax=Math.abs(xk),u=ax/(2*s);var y=TANA*(2*s/Math.sqrt(Math.PI)*Math.exp(-u*u)-ax*erfc(u));return xk>0?-y:y;}
function txt(s,x,y,size,col,w,align){g.font=(w||500)+' '+size*S+'px '+FONT;g.fillStyle=col;g.textAlign=align||'left';g.fillText(s,x*S,y*S);}
var X0=30,X1=1634,Y0=60,SH=320,KM=8,SC=0.78;
function px(xk){return X0+(xk+KM)/(2*KM)*(X1-X0);}
function py(m){return SH-m*SC;}
var t0=null;
function frame(now){if(t0===null)t0=now;var t=((now-t0)/1000+8.5)%CYC;var yr=Math.min(t/(CYC-2)*YEARS,YEARS);
 g.fillStyle='#F6F5F1';g.fillRect(0,0,3328,1280);
 g.fillStyle=SEA;g.fillRect(X0*S,Y0*S,(X1-X0)*S,(520-Y0)*S);
 g.beginPath();g.moveTo(X0*S,520*S);
 for(var i=0;400>=i;i++){var xk=-KM+2*KM*i/400;g.lineTo(px(xk)*S,py(dy(xk,yr)*1000)*S);}
 g.lineTo(X1*S,520*S);g.closePath();g.fillStyle=SAND;g.fill();
 g.fillStyle=GREEN;g.fillRect(X0*S,470*S,(X1-X0)*S,50*S);
 g.setLineDash([10*S,8*S]);g.strokeStyle='#FFFFFF';g.lineWidth=3*S;g.beginPath();g.moveTo(X0*S,py(0)*S);g.lineTo(X1*S,py(0)*S);g.stroke();g.setLineDash([]);
 g.strokeStyle=NAVY;g.lineWidth=12*S;g.beginPath();g.moveTo(px(0)*S,py(0)*S+20*S);g.lineTo(px(0)*S,(Y0+60)*S);g.stroke();
 for(var k=0;6>k;k++){var wx=X0+60+k*150;g.strokeStyle='rgba(255,255,255,0.8)';g.lineWidth=3*S;g.beginPath();g.moveTo(wx*S,(Y0+20)*S);g.lineTo((wx+90)*S,(Y0+80)*S);g.stroke();}
 txt('Waves arrive at an angle',X0+20,Y0+120,24,NAVY,600);
 g.strokeStyle=ACC;g.fillStyle=ACC;g.lineWidth=5*S;g.beginPath();g.moveTo(1100*S,(Y0+50)*S);g.lineTo(1380*S,(Y0+50)*S);g.stroke();
 g.beginPath();g.moveTo(1400*S,(Y0+50)*S);g.lineTo(1374*S,(Y0+38)*S);g.lineTo(1374*S,(Y0+62)*S);g.closePath();g.fill();
 txt('Longshore drift',1240,Y0+36,24,ACC,600,'center');
 txt('Breakwater',px(0)+14,Y0+80,24,NAVY,600);
 txt('Original shoreline',X1-10,py(0)-10,22,'#FFFFFF',600,'right');
 var up=dy(-0.001,yr)*1000,dn=dy(0.001,yr)*1000;
 g.fillStyle='#FFFFFF';g.fillRect(0,540*S,3328,200*S);
 txt('Year '+Math.floor(yr),X0,590,34,NAVY,600);
 txt('Updrift: +'+Math.round(up)+' m (sand trapped)',X0+220,590,28,BLUE,600);
 txt('Downdrift: '+Math.round(dn)+' m (beach eroded)',X0+840,590,28,ACC,600);
 txt('Computed: one-line model (Pelnard-Considère). Not to scale across the shore.',X0,628,22,SOFT,500);
 requestAnimationFrame(frame);}
requestAnimationFrame(frame);
})();
</script></body></html>
