<!doctype html><html><head><meta charset="utf-8"><title>Radar satellite orbit animation</title><style>html,body{margin:0;background:#13233A;overflow:hidden}canvas{display:block}</style></head><body><canvas id="c" width="1960" height="1320" style="width:980px;height:660px"></canvas><script>
(function(){
var cv=document.getElementById('c'),g=cv.getContext('2d');
var S=2,W=980*S,H=660*S,CX=575*S,CY=350*S,R=238*S,D=Math.PI/180;
var inc=98.2*D,raan=-52*D,el=22*D,az=-28*D;
var cE=Math.cos(el),sE=Math.sin(el),cA=Math.cos(az),sA=Math.sin(az);
var dv=[cE*cA,cE*sA,sE],e1=[-sA,cA,0],e2=[-sE*cA,-sE*sA,cE];
var TS=5,PERDAY=14.6,WE=2*Math.PI/(TS*PERDAY),ALT=1.17,U0=-5.38,TOFF=4;
var FONT='-apple-system,Segoe UI,Helvetica,Arial,sans-serif';
function dot(a,b){return a[0]*b[0]+a[1]*b[1]+a[2]*b[2];}
function cross(a,b){return [a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];}
function nrm(a){var l=Math.sqrt(dot(a,a));return [a[0]/l,a[1]/l,a[2]/l];}
function proj(p,r){return [CX+R*r*dot(p,e1),CY-R*r*dot(p,e2),dot(p,dv)];}
function ll2v(lat,lon,t){var L=lon*D+WE*t,f=lat*D;return [Math.cos(f)*Math.cos(L),Math.cos(f)*Math.sin(L),Math.sin(f)];}
function toLL(p,t){return [Math.asin(p[2])/D,(Math.atan2(p[1],p[0])-WE*t)/D];}
function orb(u){var cO=Math.cos(raan),sO=Math.sin(raan),ci=Math.cos(inc),si=Math.sin(inc),cu=Math.cos(u),su=Math.sin(u);
 return {p:[cO*cu-sO*su*ci,sO*cu+cO*su*ci,su*si],v:[-cO*su-sO*cu*ci,-sO*su+cO*cu*ci,cu*si]};}
var LAND=[
[-168,66,-162,70,-140,70,-128,71,-110,73,-95,72,-85,69,-80,63,-90,58,-95,60,-78,63,-65,60,-60,55,-56,51,-66,45,-70,42,-76,38,-81,31,-80,26,-83,29,-90,30,-97,27,-97,22,-92,18,-87,21,-88,16,-83,15,-83,10,-79,9,-80,7.5,-85,10,-92,15,-105,20,-110,24,-112,30,-117,33,-120,35,-124,40,-124,48,-130,55,-140,60,-150,61,-158,58,-165,61],
[-80,8,-75,11,-62,11,-52,5,-50,0,-35,-5,-39,-14,-41,-22,-48,-26,-53,-34,-58,-38,-63,-41,-65,-47,-68,-52,-72,-54,-75,-50,-73,-40,-71,-30,-70,-18,-76,-14,-81,-5,-80,0,-78,4],
[-17,21,-13,28,-6,36,10,37,20,31,32,31,35,28,43,12,51,12,48,4,40,-3,40,-15,35,-24,32,-29,27,-34,20,-35,18,-30,12,-17,13,-6,9,4,3,6,-8,4,-15,10,-17,15],
[-9,37,-9,43,-2,44,-4,48,2,51,8,54,9,57,5,62,14,68,24,71,33,70,40,67,44,68,55,69,66,70,73,73,80,73,90,76,100,78,112,74,130,72,141,73,155,71,170,70,180,66,170,60,163,57,156,51,155,58,143,59,137,54,141,48,135,43,129,40,129,35,126,37,121,40,122,31,117,24,109,21,106,17,109,12,105,9,101,13,100,6,103,1,98,8,98,16,94,19,90,22,86,20,80,15,77,8,73,16,70,22,66,25,57,25,52,27,48,30,50,26,56,25,59,22,55,17,45,13,43,13,39,21,35,28,34,31,36,36,28,37,26,40,23,38,22,37,20,40,19,42,14,45,12,44,16,40,16,38,12,38,10,44,8,44,3,43,-1,37,-5,36],
[114,-22,113,-26,115,-34,124,-34,131,-31,138,-35,141,-38,147,-38,150,-37,153,-31,153,-25,146,-19,142,-11,140,-17,136,-12,130,-12,126,-14,122,-18],
[-73,78,-60,82,-30,83,-20,80,-20,70,-30,68,-42,60,-50,62,-55,70],
[-5,50,1,51,-2,56,-6,58,-4,54]];
var stars=[],sd=11;function rnd(){sd=(sd*16807)%2147483647;return sd/2147483647;}
for(var i=0;140>i;i++)stars.push([rnd()*W,rnd()*H,rnd()*2.2+0.6,rnd()*0.6+0.2]);
var MER=[],PAR=[];
for(var lo=-180;180>lo;lo+=30){var m=[];for(var la=-90;90>=la;la+=3)m.push([la,lo]);MER.push(m);}
for(var la2=-60;60>=la2;la2+=30){var q=[];for(var lo2=-180;180>=lo2;lo2+=3)q.push([la2,lo2]);PAR.push([q,la2]);}
var trackN=[],trackS=[],lastSample=-1,day=-1,t0=null;
function limb(p){var q=proj(p,1);if(q[2]>=0)return q;var dx=q[0]-CX,dy=q[1]-CY,l=Math.sqrt(dx*dx+dy*dy)||1;return [CX+dx/l*R,CY+dy/l*R,q[2]];}
function line(arr,t){g.beginPath();var pen=false;for(var i=0;arr.length>i;i++){var q=proj(ll2v(arr[i][0],arr[i][1],t),1);
 if(q[2]>0){if(pen)g.lineTo(q[0],q[1]);else{g.moveTo(q[0],q[1]);pen=true;}}else pen=false;}g.stroke();}
function look(o,ang){var up=nrm(o.p),fw=nrm(o.v),rt=cross(fw,up);var c=Math.cos(ang),s=Math.sin(ang);return nrm([up[0]*c+rt[0]*s,up[1]*c+rt[1]*s,up[2]*c+rt[2]*s]);}
function txt(s,x,y,size,col,w){g.font=(w||500)+' '+size*S+'px '+FONT;g.fillStyle=col;g.fillText(s,x*S,y*S);}
function sample(t){var orbits=t/TS,o=orb(U0+2*Math.PI*orbits),d=Math.floor(orbits/PERDAY);if(d!==day){day=d;trackN=[];trackS=[];}
 if(Math.floor(orbits*120)!==lastSample){lastSample=Math.floor(orbits*120);trackN.push(toLL(nrm(o.p),t));trackS.push(toLL(look(o,0.06),t));}}
for(var pf=0;TOFF>pf;pf+=TS/120)sample(pf);
function frame(now){
 if(t0===null)t0=now;var t=(now-t0)/1000+TOFF,orbits=t/TS,u=U0+2*Math.PI*orbits,o=orb(u);sample(t);
 g.fillStyle='#13233A';g.fillRect(0,0,W,H);
 for(var i=0;stars.length>i;i++){var st=stars[i];g.globalAlpha=st[3];g.fillStyle='#fff';g.fillRect(st[0],st[1],st[2],st[2]);}
 g.globalAlpha=1;
 var ring=[];for(var k=0;200>=k;k++)ring.push(proj(orb(2*Math.PI*k/200).p,ALT));
 g.lineWidth=2*S;g.strokeStyle='rgba(184,196,214,0.35)';g.beginPath();
 for(k=1;ring.length>k;k++){if(0>=ring[k][2]){g.moveTo(ring[k-1][0],ring[k-1][1]);g.lineTo(ring[k][0],ring[k][1]);}}g.stroke();
 var sp=proj(o.p,ALT);if(0>=sp[2])sat(sp,o);
 var gr=g.createRadialGradient(CX-R*0.35,CY-R*0.4,R*0.1,CX,CY,R);gr.addColorStop(0,'#2f78c4');gr.addColorStop(1,'#0c2a52');
 g.fillStyle=gr;g.beginPath();g.arc(CX,CY,R,0,2*Math.PI);g.fill();
 g.save();g.beginPath();g.arc(CX,CY,R,0,2*Math.PI);g.clip();
 g.fillStyle='#5f8a4e';
 for(i=0;LAND.length>i;i++){var P=LAND[i],any=false;g.beginPath();
  for(var j=0;P.length>j;j+=2){var v=ll2v(P[j+1],P[j],t);if(dot(v,dv)>0)any=true;var q=limb(v);if(j===0)g.moveTo(q[0],q[1]);else g.lineTo(q[0],q[1]);}
  g.closePath();if(any)g.fill();}
 g.lineWidth=1.2*S;g.strokeStyle='rgba(255,255,255,0.18)';for(i=0;MER.length>i;i++)line(MER[i],t);
 for(i=0;PAR.length>i;i++){g.strokeStyle=PAR[i][1]===0?'rgba(255,255,255,0.45)':'rgba(255,255,255,0.18)';line(PAR[i][0],t);}
 g.lineCap='round';g.lineWidth=0.039*1.5*R;g.strokeStyle='rgba(244,162,97,0.55)';line(trackS,t);
 g.lineWidth=1.6*S;g.setLineDash([6*S,6*S]);g.strokeStyle='rgba(255,255,255,0.75)';line(trackN,t);g.setLineDash([]);
 var sh=g.createRadialGradient(CX-R*0.3,CY-R*0.35,R*0.2,CX,CY,R*1.02);sh.addColorStop(0,'rgba(255,255,255,0.10)');sh.addColorStop(0.7,'rgba(0,0,0,0)');sh.addColorStop(1,'rgba(0,0,0,0.35)');
 g.fillStyle=sh;g.fillRect(CX-R,CY-R,2*R,2*R);g.restore();
 g.lineWidth=2*S;g.strokeStyle='rgba(184,196,214,0.7)';g.beginPath();
 for(k=1;ring.length>k;k++){if(ring[k][2]>0){g.moveTo(ring[k-1][0],ring[k-1][1]);g.lineTo(ring[k][0],ring[k][1]);}}g.stroke();
 if(sp[2]>0){var a=proj(look(o,0.06-0.0195*1.5),1),b=proj(look(o,0.06+0.0195*1.5),1);
  if(a[2]>0){if(b[2]>0){g.fillStyle='rgba(244,162,97,0.30)';g.beginPath();g.moveTo(sp[0],sp[1]);g.lineTo(a[0],a[1]);g.lineTo(b[0],b[1]);g.closePath();g.fill();}}
  sat(sp,o);}
 var asc=o.v[2]>0;
 txt('Day '+(day+1)+'  ·  orbit '+(Math.floor(orbits-day*PERDAY)+1)+' of about 14.6',28,48,26,'#F6F5F1',600);
 txt(asc?'Ascending pass: moving north':'Descending pass: moving south',28,88,26,asc?'#F4A261':'#9CC3F0',600);
 var mins=Math.floor(orbits*98.6),hh=Math.floor(mins/60);txt('Time since start: '+hh+' h '+(mins-hh*60)+' min',28,126,24,'#B8C4D6');
 g.fillStyle='rgba(244,162,97,0.75)';g.fillRect(28*S,598*S,36*S,14*S);txt('Radar swath, about 250 km wide',74*S/S,612,24,'#F6F5F1');
 g.strokeStyle='rgba(255,255,255,0.8)';g.lineWidth=2*S;g.setLineDash([6*S,6*S]);g.beginPath();g.moveTo(28*S,640*S);g.lineTo(64*S,640*S);g.stroke();g.setLineDash([]);
 txt('Ground track below the satellite',74,648,24,'#F6F5F1');
 requestAnimationFrame(frame);}
function sat(sp,o){var vv=proj(o.p.map(function(c,i){return c+o.v[i]*0.01;}),ALT),ang=Math.atan2(vv[1]-sp[1],vv[0]-sp[0]);
 g.save();g.translate(sp[0],sp[1]);g.rotate(ang);
 g.fillStyle='#3b6fd1';g.strokeStyle='#cfe0ff';g.lineWidth=1*S;
 g.fillRect(-5*S,-30*S,10*S,22*S);g.strokeRect(-5*S,-30*S,10*S,22*S);g.fillRect(-5*S,8*S,10*S,22*S);g.strokeRect(-5*S,8*S,10*S,22*S);
 g.fillStyle='#E8C26A';g.fillRect(-9*S,-8*S,18*S,16*S);g.restore();}
requestAnimationFrame(frame);
})();
