<!doctype html><html><head><meta charset="utf-8"><title>Interferogram fringe animation</title><style>html,body{margin:0;background:#F6F5F1;overflow:hidden}canvas{display:block}</style></head><body><canvas id="c" width="3328" height="1240" style="width:1664px;height:620px"></canvas><script>
(function(){
var cv=document.getElementById('c'),g=cv.getContext('2d');
var S=2,W=1664*S,H=620*S,N=200,LAM=5.6,PERIOD=16,AMAX=14;
var FONT='-apple-system,Segoe UI,Helvetica,Arial,sans-serif',NAVY='#13233A',SOFT='#4A5563';
var off=document.createElement('canvas');off.width=N;off.height=N;var og=off.getContext('2d'),img=og.createImageData(N,N);
var sd=7;function rnd(){sd=(sd*16807)%2147483647;return sd/2147483647;}
var shape=new Float32Array(N*N),noise=new Float32Array(N*N),relief=new Float32Array(N*N);
for(var y=0;N>y;y++)for(var x=0;N>x;x++){var dx=(x-N*0.48)/(N*0.17),dy=(y-N*0.5)/(N*0.17);
 shape[y*N+x]=Math.pow(1+dx*dx+dy*dy,-1.5);noise[y*N+x]=(rnd()+rnd()-1)*0.06;
 relief[y*N+x]=0.9+0.1*Math.sin(x*0.11+Math.sin(y*0.07)*2)*Math.cos(y*0.09);}
function hue(h,out,k,v){var i=Math.floor(h*6),f=h*6-i,s=0.72,p=1-s,q=1-s*f,t=1-s*(1-f),r,gg,b;i=((i%6)+6)%6;
 if(i===0){r=1;gg=t;b=p;}else if(i===1){r=q;gg=1;b=p;}else if(i===2){r=p;gg=1;b=t;}else if(i===3){r=p;gg=q;b=1;}else if(i===4){r=t;gg=p;b=1;}else{r=1;gg=p;b=q;}
 out[k]=255*r*v;out[k+1]=255*gg*v;out[k+2]=255*b*v;out[k+3]=255;}
function txt(s,x,y,size,col,w,fam){g.font=(w||500)+' '+size*S+'px '+(fam||FONT);g.fillStyle=col;g.fillText(s,x*S,y*S);}
function rr(x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}
var t0=null;
function frame(now){if(t0===null)t0=now;var t=(now-t0)/1000+4.5;
 var A=AMAX*0.5*(1-Math.cos(2*Math.PI*t/PERIOD)),d=img.data;
 for(var i=0;N*N>i;i++){var f=2*A*shape[i]/LAM+noise[i];hue(f-Math.floor(f),d,i*4,relief[i]);}
 og.putImageData(img,0,0);
 g.fillStyle='#F6F5F1';g.fillRect(0,0,W,H);
 g.save();rr(0,10*S,600*S,600*S,16*S);g.clip();g.imageSmoothingEnabled=true;g.drawImage(off,0,10*S,600*S,600*S);g.restore();
 g.strokeStyle='#E2DFD7';g.lineWidth=2*S;rr(0,10*S,600*S,600*S,16*S);g.stroke();
 var X=660;
 txt('Uplift at the centre',X,46,26,SOFT);
 txt(A.toFixed(1)+' cm',X,118,64,NAVY,500,'IBM Plex Mono,Menlo,Courier New,monospace');
 txt('=  '+(2*A/LAM).toFixed(1)+' fringes',X+350,112,40,'#C2410C',600);
 var bx=X*S,by=160*S,bw=560*S,bh=34*S;
 for(var k=0;bw>k;k+=2*S){var c=[],h=k/bw;hue(h,c,0,1);g.fillStyle='rgb('+Math.round(c[0])+','+Math.round(c[1])+','+Math.round(c[2])+')';g.fillRect(bx+k,by,2*S+1,bh);}
 txt('0 cm',X,226,24,SOFT);txt('2.8 cm',X+485,226,24,SOFT);
 txt('One full colour cycle = λ/2 = 2.8 cm of motion toward the satellite',X,262,24,NAVY);
 var px=X*S,py=300*S,pw=900*S,ph=300*S,base=py+ph-70*S;
 g.fillStyle='#FFFFFF';rr(px,py,pw,ph,16*S);g.fill();g.strokeStyle='#E2DFD7';g.lineWidth=2*S;g.stroke();
 txt('Cross-section through the volcano (uplift exaggerated)',X+24,py/S+40,24,SOFT);
 g.beginPath();g.moveTo(px+20*S,base);
 for(var s=0;1>=s;s+=0.01){var dxs=(s-0.48)/0.17,u=Math.pow(1+dxs*dxs,-1.5);g.lineTo(px+20*S+s*(pw-40*S),base-u*A/AMAX*120*S);}
 g.lineTo(px+pw-20*S,base);g.lineTo(px+pw-20*S,base+50*S);g.lineTo(px+20*S,base+50*S);g.closePath();g.fillStyle='#C9B48A';g.fill();
 g.strokeStyle='#8A6A3A';g.lineWidth=3*S;g.beginPath();g.moveTo(px+20*S,base);
 for(s=0;1>=s;s+=0.01){dxs=(s-0.48)/0.17;u=Math.pow(1+dxs*dxs,-1.5);g.lineTo(px+20*S+s*(pw-40*S),base-u*A/AMAX*120*S);}g.stroke();
 g.setLineDash([8*S,6*S]);g.strokeStyle='rgba(19,35,58,0.35)';g.lineWidth=2*S;g.beginPath();g.moveTo(px+20*S,base);g.lineTo(px+pw-20*S,base);g.stroke();g.setLineDash([]);
 var sx=px+pw-110*S,sy=py+70*S,tx=px+20*S+0.48*(pw-40*S),ty=base-A/AMAX*120*S;
 g.strokeStyle='#C2410C';g.lineWidth=3*S;g.beginPath();g.moveTo(sx,sy);g.lineTo(tx+40*S,ty-20*S);g.stroke();
 var an=Math.atan2(ty-20*S-sy,tx+40*S-sx);g.fillStyle='#C2410C';g.beginPath();g.moveTo(tx+40*S,ty-20*S);
 g.lineTo(tx+40*S-18*S*Math.cos(an-0.4),ty-20*S-18*S*Math.sin(an-0.4));g.lineTo(tx+40*S-18*S*Math.cos(an+0.4),ty-20*S-18*S*Math.sin(an+0.4));g.closePath();g.fill();
 g.save();g.translate(sx,sy);g.rotate(-0.5);g.fillStyle='#3b6fd1';g.fillRect(-34*S,-6*S,22*S,12*S);g.fillRect(12*S,-6*S,22*S,12*S);g.fillStyle='#E8C26A';g.fillRect(-11*S,-10*S,22*S,20*S);g.restore();
 txt('Line of sight',(sx/S)-90,(sy/S)+80,24,'#C2410C',600);
 requestAnimationFrame(frame);}
requestAnimationFrame(frame);
})();
</script></body></html>
