<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#F6F5F1;overflow:hidden}canvas{display:block}</style></head><body><canvas id="c" width="3328" height="1280" style="width:1664px;height:640px"></canvas><script>
(function(){
var cv=document.getElementById('c'),g=cv.getContext('2d'),S=2;
var FONT='-apple-system,Segoe UI,Helvetica,Arial,sans-serif',NAVY='#13233A',SOFT='#4A5563',ACC='#C2410C',BLUE='#2F6DB5',SEA='#8FB3DD',LAND='#D8D2C2',FLOOR='#B9B1A0';
var GR=9.81,A0=0.5,TAU=420,KMAX=1440,COAST=1310,HMIN=5,CYC=18,RUN=15;
var X0=40,X1=1624,SY=240,DK=3.95,AZ=45;
function zy(h){return SY+Math.sqrt(Math.max(h,0))*DK;}
var DART=450,SAT=760;
function depth(k){if(1080>k){return 4000;}if(1240>k){return 4000-3900*(k-1080)/160;}if(1300>k){return 100-90*(k-1240)/60;}if(COAST>k){return 10-10*(k-1300)/(COAST-1300);}return -1;}
function px(k){return X0+k/KMAX*(X1-X0);}
var T=[0],XE=0;
for(var k=1;COAST>=k;k++){var h=depth(k-0.5);if(HMIN>h){XE=k-1;break;}T.push(T[k-1]+1000/Math.sqrt(GR*h));}
var TEND=T[XE];
function xAt(t){if(t>=TEND){return XE;}var lo=0,hi=XE;while(hi-lo>1){var m=(lo+hi)>>1;if(T[m]>t){hi=m;}else{lo=m;}}return lo+(t-T[lo])/(T[hi]-T[lo]);}
function hm(t){var m=Math.round(t/60);return Math.floor(m/60)+' h '+(10>m%60?'0':'')+(m%60)+' min';}
function txt(s,x,y,size,col,w,align){g.font=(w||500)+' '+size*S+'px '+FONT;g.fillStyle=col;g.textAlign=align||'left';g.fillText(s,x*S,y*S);}
var t0=null;
function frame(now){if(t0===null)t0=now;var t=((now-t0)/1000+6)%CYC;var tm=Math.min(t/RUN,1)*(TEND+300);
 var xc=xAt(tm),hc=Math.max(depth(Math.min(xc,XE)),HMIN),c=Math.sqrt(GR*hc),A=A0*Math.pow(4000/hc,0.25),w=Math.max(c*TAU/1000,9);
 g.fillStyle='#F6F5F1';g.fillRect(0,0,3328,1280);
 g.beginPath();g.moveTo(px(0)*S,SY*S);
 for(var i=0;XE>=i;i+=0.5){var e=A*Math.exp(-Math.pow((i-xc)/w,2));g.lineTo(px(i)*S,(SY-e*AZ)*S);}
 g.lineTo(px(COAST)*S,SY*S);
 for(var j=COAST;j>=0;j-=2){g.lineTo(px(j)*S,zy(depth(j))*S);}
 g.closePath();g.fillStyle=SEA;g.fill();
 g.beginPath();g.moveTo(px(0)*S,zy(4000)*S);
 for(var j2=0;COAST>=j2;j2+=2){g.lineTo(px(j2)*S,zy(depth(j2))*S);}
 g.lineTo(px(KMAX)*S,(SY-40)*S);g.lineTo(px(KMAX)*S,520*S);g.lineTo(px(0)*S,520*S);g.closePath();g.fillStyle=LAND;g.fill();
 g.strokeStyle=BLUE;g.lineWidth=3*S;g.beginPath();
 for(var i2=0;XE>=i2;i2+=0.5){var e2=A*Math.exp(-Math.pow((i2-xc)/w,2));if(i2===0){g.moveTo(px(i2)*S,(SY-e2*AZ)*S);}else{g.lineTo(px(i2)*S,(SY-e2*AZ)*S);}}
 g.stroke();
 txt('Computed: speed = √(g × depth); height from Green’s law. Wave heights exaggerated; depths on a square-root scale.',X0,34,24,SOFT,500);
 txt('Earthquake',px(30),zy(4000)+30,24,ACC,600,'center');
 g.fillStyle=ACC;g.beginPath();g.arc(px(30)*S,(zy(4000)-6)*S,9*S,0,7);g.fill();
 txt('Deep ocean, 4000 m',px(800),SY+150,26,NAVY,600,'center');
 txt('Slope',px(1110),SY+130,24,NAVY,600,'center');
 txt('Shelf',px(1270),SY+80,24,NAVY,600,'center');
 var dartT=T[DART],satT=T[SAT];
 g.strokeStyle=SOFT;g.lineWidth=1.5*S;g.setLineDash([6*S,6*S]);g.beginPath();g.moveTo(px(DART)*S,SY*S);g.lineTo(px(DART)*S,zy(4000)*S);g.stroke();g.setLineDash([]);
 var dy=A*Math.exp(-Math.pow((DART-xc)/w,2))*AZ;
 g.fillStyle=tm>=dartT?ACC:NAVY;g.fillRect((px(DART)-12)*S,(SY-dy-14)*S,24*S,14*S);
 g.fillStyle=NAVY;g.fillRect((px(DART)-14)*S,(zy(4000)-12)*S,28*S,12*S);
 txt('DART buoy',px(DART),SY-38,24,NAVY,600,'center');
 var sv=Math.abs(tm-satT)/600;
 if(1>sv){g.globalAlpha=1-sv;g.fillStyle=NAVY;g.fillRect((px(SAT)-16)*S,62*S,32*S,20*S);g.fillRect((px(SAT)-46)*S,67*S,24*S,10*S);g.fillRect((px(SAT)+22)*S,67*S,24*S,10*S);
  g.strokeStyle=NAVY;g.lineWidth=2*S;g.setLineDash([8*S,6*S]);g.beginPath();g.moveTo(px(SAT)*S,84*S);g.lineTo(px(SAT)*S,(SY-30)*S);g.stroke();g.setLineDash([]);
  txt('Altimeter overhead',px(SAT)+56,80,24,NAVY,600);g.globalAlpha=1;}
 g.fillStyle=tm>=TEND?ACC:NAVY;g.beginPath();g.moveTo(px(COAST+12)*S,(SY-26)*S);g.lineTo(px(COAST+3)*S,(SY-8)*S);g.lineTo(px(COAST+21)*S,(SY-8)*S);g.closePath();g.fill();
 txt('Tide',px(COAST+26),SY-62,24,NAVY,600);txt('gauge',px(COAST+26),SY-34,24,NAVY,600);
 g.fillStyle='#FFFFFF';g.fillRect(0,530*S,3328,110*S);
 txt(hm(Math.min(tm,TEND)),X0,572,32,NAVY,700);
 txt('Depth under the crest: '+Math.round(hc)+' m',X0+230,572,26,NAVY,500);
 txt('Speed: '+Math.round(c*3.6)+' km/h',X0+690,572,26,NAVY,500);
 txt('Height: '+A.toFixed(1)+' m',X0+990,572,26,ACC,700);
 function st(label,tt,x){var done=tm>=tt;txt(label+(done?hm(tt):'waiting'),x,616,24,done?ACC:SOFT,600);}
 st('DART buoy detects it: ',dartT,X0);st('Satellite measures it: ',satT,X0+520);st('Reaches the tide gauge: ',TEND,X0+1060);
 requestAnimationFrame(frame);}
requestAnimationFrame(frame);
})();
</script></body></html>
