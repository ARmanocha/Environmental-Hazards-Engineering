<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#F6F5F1;overflow:hidden}canvas{display:block}</style></head><body><canvas id="c" width="3328" height="1280" style="width:1664px;height:640px"></canvas><script>
(function(){
var cv=document.getElementById('c'),g=cv.getContext('2d'),S=2;
var FONT='-apple-system,Segoe UI,Helvetica,Arial,sans-serif',NAVY='#13233A',SOFT='#4A5563',ACC='#C2410C',LAND='#D8D2C2';
var N=140,KM=24,D=4000,NU=0.25,LAM=0.055466,VMAX=20e6,CYC=16;
var th=39*Math.PI/180,az=260*Math.PI/180,sx=Math.sin(th)*Math.sin(az),sy=Math.sin(th)*Math.cos(az),sz=Math.cos(th);
var L=new Float32Array(N*N),lmin=1e9,lmax=-1e9;
for(var j=0;N>j;j++){for(var i=0;N>i;i++){var x=((i+0.5)/N-0.5)*KM*1000,y=(0.5-(j+0.5)/N)*KM*1000;var q=Math.pow(x*x+y*y+D*D,1.5);var v=(1-NU)/Math.PI*(sx*x+sy*y+sz*D)/q;L[j*N+i]=v;if(lmin>v){lmin=v;}if(v>lmax){lmax=v;}}}
var PAL=[];for(var k=0;256>k;k++){var hh=k/256*6,f=hh-Math.floor(hh),s=0.72,vv=0.95,p=vv*(1-s),qq=vv*(1-s*f),t=vv*(1-s*(1-f)),m=Math.floor(hh)%6;
 var rgb=[[vv,t,p],[qq,vv,p],[p,vv,t],[p,qq,vv],[t,p,vv],[vv,p,qq]][m];PAL.push([Math.round(rgb[0]*255),Math.round(rgb[1]*255),Math.round(rgb[2]*255)]);}
var oc=document.createElement('canvas');oc.width=N;oc.height=N;var ox=oc.getContext('2d'),im=ox.createImageData(N,N);
function txt(s,x,y,size,col,w,align){g.font=(w||500)+' '+size*S+'px '+FONT;g.fillStyle=col;g.textAlign=align||'left';g.fillText(s,x*S,y*S);}
var MX=40,MY=24,MS=500,XL=620,XR=1640,GY=235,PK=(XR-XL)/KM,EX=230;
function vol(t){if(9>t){return VMAX*t/9;}if(11>t){return VMAX;}if(13.5>t){return VMAX*(13.5-t)/2.5;}return 0;}
function uz(xkm,V){var x=xkm*1000;return (1-NU)*V/Math.PI*D/Math.pow(x*x+D*D,1.5);}
function cone(xkm){return 70*Math.exp(-xkm*xkm/(2*9));}
var t0=null;
function frame(now){if(t0===null)t0=now;var t=((now-t0)/1000+7)%CYC;var V=vol(t);
 g.fillStyle='#F6F5F1';g.fillRect(0,0,3328,1280);
 var d=im.data;for(var n=0;N*N>n;n++){var ph=-4*Math.PI/LAM*V*L[n];ph=((ph%(2*Math.PI))+2*Math.PI)%(2*Math.PI);var c=PAL[Math.floor(ph/(2*Math.PI)*255.999)];d[4*n]=c[0];d[4*n+1]=c[1];d[4*n+2]=c[2];d[4*n+3]=255;}
 ox.putImageData(im,0,0);g.imageSmoothingEnabled=true;g.drawImage(oc,MX*S,MY*S,MS*S,MS*S);
 g.strokeStyle=NAVY;g.lineWidth=2*S;g.strokeRect(MX*S,MY*S,MS*S,MS*S);
 g.fillStyle='#FFFFFF';g.beginPath();g.moveTo((MX+MS/2)*S,(MY+MS/2-11)*S);g.lineTo((MX+MS/2-10)*S,(MY+MS/2+7)*S);g.lineTo((MX+MS/2+10)*S,(MY+MS/2+7)*S);g.closePath();g.fill();
 txt('Interferogram, 24 × 24 km',MX,MY+MS+30,24,NAVY,600);
 g.fillStyle=LAND;g.beginPath();g.moveTo(XL*S,520*S);
 for(var a=0;200>=a;a++){var xk=-KM/2+KM*a/200;g.lineTo((XL+(xk+KM/2)*PK)*S,(GY-cone(xk)-uz(xk,V)*EX)*S);}
 g.lineTo(XR*S,520*S);g.closePath();g.fill();
 g.strokeStyle=NAVY;g.lineWidth=3*S;g.beginPath();
 for(var b=0;200>=b;b++){var xk2=-KM/2+KM*b/200,yy=(GY-cone(xk2)-uz(xk2,V)*EX)*S,xx=(XL+(xk2+KM/2)*PK)*S;if(b===0){g.moveTo(xx,yy);}else{g.lineTo(xx,yy);}}
 g.stroke();
 g.strokeStyle=SOFT;g.lineWidth=2*S;g.setLineDash([8*S,6*S]);g.beginPath();
 for(var e=0;200>=e;e++){var xk3=-KM/2+KM*e/200,yy3=(GY-cone(xk3))*S,xx3=(XL+(xk3+KM/2)*PK)*S;if(e===0){g.moveTo(xx3,yy3);}else{g.lineTo(xx3,yy3);}}
 g.stroke();g.setLineDash([]);
 var cx=(XL+XR)/2,cy=GY+4*PK,rad=22+22*V/VMAX;
 g.fillStyle=ACC;g.beginPath();g.ellipse(cx*S,cy*S,rad*1.5*S,rad*S,0,0,7);g.fill();
 txt('Magma chamber, 4 km deep',cx+rad*1.5+16,cy+8,26,ACC,600);
 txt('Dashed: ground before. Uplift exaggerated about 5,000 times.',XL,40,24,SOFT,500);
 g.fillStyle='#FFFFFF';g.fillRect(0,560*S,3328,80*S);
 var u0=uz(0,V)*100,fr=(lmax-lmin)*V*100/(LAM*100/2);
 var st=V===VMAX?'Holding: ground stays up':(t>11?'Eruption: magma leaves, ground sinks':'Magma flowing in: ground rises');
 txt(st,MX,608,28,t>11?ACC:NAVY,700);
 txt('Volume added: '+(V/1e6).toFixed(1)+' million m³',MX+620,608,26,NAVY,500);
 txt('Uplift: '+u0.toFixed(0)+' cm',MX+1060,608,26,NAVY,500);
 txt('Fringes: '+Math.round(fr),MX+1300,608,26,NAVY,600);
 requestAnimationFrame(frame);}
requestAnimationFrame(frame);
})();
</script></body></html>
